name: Deploy KaamConnect demo
on:
  push:
    branches:
      - codex/kaamconnect-responsive
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare demo site
        run: |
          mkdir _site
          cp kaamconnect-website/preview.html _site/index.html
      - name: Upload demo site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy demo site
        id: deployment
        uses: actions/deploy-pages@v4
